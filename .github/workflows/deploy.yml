name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production release at a time. Never cancel a deployment midway.
concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Emits the static export into `out/`, per `output: "export"`.
      - run: npm run build

      - run: npx wrangler deploy --dry-run

      # Only a push to main may publish. Every manual dispatch is
      # verification-only, including a dispatch from main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
